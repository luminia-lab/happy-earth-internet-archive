name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate source
        run: node scripts/validate-site.mjs

      - name: Build static site
        run: node scripts/build-static-site.mjs

      - name: Apply MESANG company identity
        run: node scripts/patch-mesang-brand.mjs

      - name: Validate static SEO
        run: node scripts/validate-static-seo.mjs

      - name: Validate built site and JavaScript
        run: |
          SITE_ROOT=dist node scripts/validate-site.mjs
          for file in site/assets/js/*.js; do node --check "$file"; done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
